openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /book/settings:
    get:
      operationId: getBookSettings
      responses:
        "200":
          description: Public sale configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookSettings" }
  /book/me:
    get:
      operationId: getBookMe
      responses:
        "200":
          description: Current access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookMe" }
  /book/orders:
    get:
      operationId: listBookOrders
      responses:
        "200":
          description: Current user's orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BookOrder" }
    post:
      operationId: createBookOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Order created; Stripe URL for card orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookOrder" }
  /book/orders/{id}/verify:
    post:
      operationId: verifyBookPayment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Server-verified payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookOrder" }
  /book/orders/{id}/retry:
    post:
      operationId: retryBookCheckout
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Existing card checkout resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookOrder" }
  /book/orders/{id}/download:
    get:
      operationId: downloadBook
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized PDF download
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /book/uploads:
    post:
      operationId: requestBookUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Private direct upload destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadDestination" }
  /book/admin/settings:
    put:
      operationId: saveBookSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsInput" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookSettings" }
  /book/admin/orders:
    get:
      operationId: listAdminBookOrders
      responses:
        "200":
          description: Orders for review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BookOrder" }
  /book/admin/orders/{id}:
    patch:
      operationId: reviewBookOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Reviewed order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookOrder" }
  /book/admin/orders/{id}/receipt:
    get:
      operationId: downloadReceipt
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private receipt
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    BookSettings:
      type: object
      required: [price, offerPrice, offerLimit, offerAvailable, currency, vodafoneCash, instaPay, bookReady, cardReady, salesEnabled]
      properties:
        price: { type: [number, "null"] }
        offerPrice: { type: [number, "null"] }
        offerLimit: { type: integer, minimum: 1 }
        offerAvailable: { type: boolean }
        currency: { type: string }
        vodafoneCash: { type: string }
        instaPay: { type: string }
        bookReady: { type: boolean }
        cardReady: { type: boolean }
        salesEnabled: { type: boolean }
    SettingsInput:
      type: object
      required: [price, offerPrice, offerLimit, currency, vodafoneCash, instaPay, salesEnabled]
      properties:
        price: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        offerPrice: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        offerLimit: { type: integer, minimum: 1, maximum: 100000 }
        currency: { type: string, enum: [egp, usd] }
        vodafoneCash: { type: string, maxLength: 100 }
        instaPay: { type: string, maxLength: 200 }
        bookObjectPath: { type: string }
        salesEnabled: { type: boolean }
    BookMe:
      type: object
      required: [signedIn, isAdmin]
      properties:
        signedIn: { type: boolean }
        isAdmin: { type: boolean }
    BookOrder:
      type: object
      required: [id, name, email, method, status, amount, currency, priceTier, createdAt, hasReceipt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        method: { type: string, enum: [card, vodafone, instapay] }
        status: { type: string, enum: [pending, paid, rejected, failed, expired] }
        amount: { type: number }
        currency: { type: string }
        priceTier: { type: string, enum: [offer, regular] }
        createdAt: { type: string }
        hasReceipt: { type: boolean }
        checkoutUrl: { type: [string, "null"] }
        reviewNote: { type: [string, "null"] }
    OrderInput:
      type: object
      required: [name, email, method, language, expectedAmount, expectedCurrency]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 200 }
        method: { type: string, enum: [card, vodafone, instapay] }
        language: { type: string, enum: [ar, en] }
        expectedAmount: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        expectedCurrency: { type: string, enum: [egp, usd] }
        receiptObjectPath: { type: string }
    UploadInput:
      type: object
      required: [name, size, contentType, purpose]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, minimum: 1, maximum: 52428800 }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        purpose: { type: string, enum: [receipt, book] }
    UploadDestination:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    ReviewInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [paid, rejected] }
        reviewNote: { type: string, maxLength: 1000 }